description='''自動運転 — 自動運転装置で列車を右クリックすると、運転士が自動で乗務して走り出します。
駅ブロックの前で自動的に減速して停車し、ドアを開けて発車します。信号があれば現示に従います。
自動運転中の編成はチャンクが読み込まれていなくても走り続けるので、遠くの駅から列車が来ます。
(RTMU 純正のアドオン。RTMU 本体が必要です)'''

