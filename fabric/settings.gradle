pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

//本体のみ。webctc / atsa は本体が通ってから移植する (src は残してある)。
rootProject.name = 'RTMU-fabric'
